<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PhishingDetector | 封面页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --text-soft: rgba(255,255,255,0.86);
      --text-muted: rgba(255,255,255,0.64);
      --radius-full: 9999px;
      --radius-card: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      font-family: "Barlow", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-strong {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .section {
      position: relative;
      min-height: 100vh;
      background: #000;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .section video {
      position: absolute;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
    }

    .hero-video {
      left: 50%;
      top: 0;
      width: 120%;
      height: 120%;
      transform: translateX(-50%);
      object-fit: cover;
      object-position: center top;
    }

    .section-inner {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .nav-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: "Instrument Serif", "Noto Serif SC", serif;
      font-style: italic;
      font-size: 30px;
      line-height: 1;
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: var(--radius-full);
    }

    .nav-center a {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      padding: 8px 12px;
      white-space: nowrap;
    }

    .nav-center a.active {
      color: #fff;
      background: rgba(255,255,255,0.12);
      border-radius: var(--radius-full);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: var(--radius-full);
      background: #fff;
      color: #000 !important;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-spacer { width: 48px; height: 48px; }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 120px 16px 26px;
    }

    .fade-item {
      opacity: 0;
      transform: translateY(20px);
      filter: blur(10px);
      transition: opacity 0.9s ease, transform 0.9s ease, filter 0.9s ease;
    }

    .fade-item.in {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 8px 8px;
      border-radius: var(--radius-full);
      margin-bottom: 24px;
    }

    .hero-chip {
      background: #fff;
      color: #000;
      border-radius: var(--radius-full);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .hero-badge span:last-child {
      font-size: 14px;
      color: rgba(255,255,255,0.92);
      padding-right: 6px;
    }

    .title {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      row-gap: 0.1em;
      max-width: 1000px;
      margin: 0 auto;
      font-family: "Instrument Serif", "Noto Serif SC", serif;
      font-style: italic;
      font-size: clamp(54px, 9.8vw, 92px);
      line-height: 0.82;
      letter-spacing: -4px;
    }

    .title span {
      display: inline-block;
      margin-right: 0.28em;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(50px);
    }

    .subtitle {
      max-width: 790px;
      margin: 18px auto 0;
      color: var(--text-soft);
      font-size: 16px;
      line-height: 1.68;
      font-weight: 300;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .start-btn {
      border-radius: var(--radius-full);
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .hero-cards {
      margin-top: 32px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hero-card {
      width: 230px;
      border-radius: 20px;
      padding: 20px;
    }

    .hero-card h3 {
      margin: 20px 0 0;
      font-family: "Instrument Serif", "Noto Serif SC", serif;
      font-style: italic;
      font-size: 40px;
      line-height: 1;
      letter-spacing: -1px;
    }

    .hero-card p {
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255,255,255,0.8);
      font-weight: 300;
    }

    .partners {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 0 16px 34px;
    }

    .partners .chip {
      border-radius: var(--radius-full);
      padding: 9px 16px;
      font-size: 12px;
      font-weight: 500;
    }

    .partners .row {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
      font-family: "Instrument Serif", "Noto Serif SC", serif;
      font-style: italic;
      font-size: clamp(24px, 3.6vw, 36px);
      letter-spacing: -1px;
    }

    @media (max-width: 1080px) {
      .nav-center { display: none; }
    }

    @media (max-width: 768px) {
      .navbar { padding: 0 16px; }
      .hero { padding-left: 16px; padding-right: 16px; }
      .partners .row { gap: 16px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-logo liquid-glass">P</div>
    <nav class="nav-center liquid-glass" aria-label="导航">
      <a class="active" href="#hero">首页</a>
      <a href="#hero">检测引擎</a>
      <a href="#hero">知识库</a>
      <a href="#hero">报告中心</a>
      <a href="#hero">关于</a>
      <a href="/studio" class="nav-cta">开始检测 <span aria-hidden="true">↗</span></a>
    </nav>
    <div class="nav-spacer"></div>
  </header>

  <section class="section" id="hero">
    <video id="heroVideo" class="hero-video" autoPlay muted playsInline preload="auto" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4"></video>
    <div class="section-inner">
      <div class="hero">
        <div class="hero-badge liquid-glass fade-item" data-delay="0.35">
          <span class="hero-chip">Security</span>

        </p>

        <div class="actions fade-item" data-delay="1.1">
          <a href="/studio" class="start-btn liquid-glass-strong">开始检测 <span aria-hidden="true">↗</span></a>
          <a href="/studio" class="text-link">查看核心能力 <span aria-hidden="true">▶</span></a>
        </div>

        <div class="hero-cards fade-item" data-delay="1.25">
          <div class="hero-card liquid-glass">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            <h3>2.4s</h3>
            <p>在常规样本下，首个结构化风险信号可在数秒内反馈。</p>
          </div>

            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a15 15 0 0 1 0 18"></path><path d="M12 3a15 15 0 0 0 0 18"></path></svg>

        <div class="row">
          <span>域名检测</span>

          <span>风险研判</span>
          <span>ATT&CK 映射</span>
        </div>
      </div>
    </div>
  </section>

  <script>
    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function attachFadingVideo(video) {
      let rafId = 0;
      let fadeToken = 0;
      let fadingOut = false;

      function getOpacity() {
        const raw = parseFloat(video.style.opacity || "0");
        return Number.isFinite(raw) ? raw : 0;
      }

      function fadeTo(target, duration) {
        fadeToken += 1;
        const token = fadeToken;
        const start = performance.now();
        const from = getOpacity();
        cancelAnimationFrame(rafId);

        function tick(now) {
          if (token !== fadeToken) return;
          const progress = Math.min((now - start) / duration, 1);
          video.style.opacity = String(from + (target - from) * progress);
          if (progress < 1) rafId = requestAnimationFrame(tick);
        }

        rafId = requestAnimationFrame(tick);
      }

      function onLoadedData() {
        video.style.opacity = "0";
        video.play().catch(() => {});
        fadeTo(1, FADE_MS);
      }

      function onTimeUpdate() {
        const remaining = video.duration - video.currentTime;
        if (!fadingOut && remaining <= FADE_OUT_LEAD && remaining > 0) {
          fadingOut = true;
          fadeTo(0, FADE_MS);
        }
      }

      function onEnded() {
        video.style.opacity = "0";
        setTimeout(() => {
          video.currentTime = 0;
          video.play().catch(() => {});
          fadingOut = false;
          fadeTo(1, FADE_MS);
        }, 100);
      }

      video.loop = false;
      video.addEventListener("loadeddata", onLoadedData);
      video.addEventListener("timeupdate", onTimeUpdate);
      video.addEventListener("ended", onEnded);
    }

    function animateTitle() {
      const text = "Detect Phishing Before It Reaches Your Team";
      const host = document.getElementById("heroTitle");
      host.innerHTML = "";
      text.split(" ").forEach((word, index) => {
        const span = document.createElement("span");
        span.textContent = word;
        host.appendChild(span);
        setTimeout(() => {
          span.animate([
            { filter: "blur(10px)", opacity: 0, transform: "translateY(50px)" },
            { filter: "blur(5px)", opacity: 0.5, transform: "translateY(-5px)", offset: 0.5 },
            { filter: "blur(0px)", opacity: 1, transform: "translateY(0)" }
          ], {
            duration: 700,
            easing: "cubic-bezier(0.16, 1, 0.3, 1)",
            fill: "forwards"
          });
        }, index * 100);
      });
    }

    function revealFadeItems() {
      document.querySelectorAll(".fade-item").forEach((node) => {
        const delay = Number(node.dataset.delay || 0) * 1000;
        setTimeout(() => node.classList.add("in"), delay);
      });
    }

    attachFadingVideo(document.getElementById("heroVideo"));
    animateTitle();
    revealFadeItems();
  </script>
</body>
